name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.4.3), must match VERSION_NAME in nb4a.properties. Created on the selected branch's head if it does not exist yet."
        required: true

permissions:
  contents: write

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(grep '^VERSION_NAME=' nb4a.properties | cut -d= -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match VERSION_NAME=$version in nb4a.properties"
            exit 1
          fi
          # an existing tag must point at the commit being released
          if existing=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG already exists on $existing, not on $GITHUB_SHA"
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
      require-signing: true
    secrets: inherit

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          sparse-checkout: .github/release-notes

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: apks

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          # a manual run creates the tag on the released commit
          flags=(--title "$TAG" --target "$SHA")
          # hand-written notes for the tag if present, otherwise GitHub's generated ones
          if [ -f ".github/release-notes/$TAG.md" ]; then
            flags+=(--notes-file ".github/release-notes/$TAG.md")
          else
            flags+=(--generate-notes)
          fi
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" apks/* --clobber
          else
            gh release create "$TAG" apks/* "${flags[@]}"
          fi
